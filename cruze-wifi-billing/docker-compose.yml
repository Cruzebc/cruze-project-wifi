services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: cruze_billing
      POSTGRES_USER: cruze
      POSTGRES_PASSWORD: cruze_password
    volumes:
      - cruze_pg:/var/lib/postgresql/data

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    depends_on:
      - db
    ports:
      - "8080:8080"

volumes:
  cruze_pg:
