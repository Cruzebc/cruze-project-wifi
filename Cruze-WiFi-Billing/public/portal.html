<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cruze Wi-Fi</title>
<style>body{margin:0;background:#071018;color:#eef6f1;font-family:system-ui}.wrap{max-width:900px;margin:40px auto;padding:20px}.hero{padding:30px;border-radius:22px;background:linear-gradient(135deg,#102b24,#0b1722);border:1px solid #203b36}h1{font-size:38px}.packages{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-top:20px}.p{padding:20px;background:#0e1b26;border:1px solid #203142;border-radius:16px}.price{font-size:28px;font-weight:800;color:#45e39a}input,button{padding:12px;border-radius:10px;border:1px solid #294052;background:#08121b;color:#fff}button{cursor:pointer}button.buy{background:#45e39a;color:#06100b;font-weight:800;width:100%;margin-top:12px}.phone{width:100%;margin:14px 0;box-sizing:border-box}</style></head><body><div class="wrap"><div class="hero"><h1>CRUZE Wi-Fi</h1><p>Select your package and pay securely through M-Pesa.</p><input id="phone" class="phone" placeholder="M-Pesa phone number e.g. 2547..." /></div><div id="packages" class="packages"></div><p id="msg"></p></div><script>
async function load(){let ps=await fetch("/api/packages").then(r=>r.json());document.getElementById("packages").innerHTML=ps.map(p=>`<div class="p"><h2>${p.name}</h2><p>${p.description||""}</p><div class="price">Ksh ${p.price}</div><p>${p.durationMinutes} minutes · ${p.downloadMbps||"Standard"} Mbps ↓</p><button class="buy" onclick="buy('${p.id}')">PAY WITH M-PESA</button></div>`).join("")}
async function buy(id){let phone=document.getElementById("phone").value;document.getElementById("msg").textContent="Sending payment prompt…";let r=await fetch("/api/payments/stk",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({phone,packageId:id})});let d=await r.json();document.getElementById("msg").textContent=r.ok?"Check your phone and complete the M-Pesa prompt.":"Error: "+(d.error||"Payment failed")}
load();</script></body></html>
