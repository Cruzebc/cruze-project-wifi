<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cruze Wi-Fi Billing</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:#eaf0f7;background:#071018;--panel:#0d1823;--panel2:#111f2d;--line:#203142;--accent:#45e39a;--muted:#91a4b7}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% -10%,#123c36 0,#071018 42%);min-height:100vh}
header{height:70px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px;background:#09131de8;backdrop-filter:blur(14px);position:sticky;top:0;z-index:3}
.brand{font-weight:800;letter-spacing:.08em}.brand b{color:var(--accent)}nav{display:flex;gap:8px}button{border:1px solid var(--line);background:var(--panel2);color:#fff;border-radius:10px;padding:10px 14px;cursor:pointer}button.primary{background:var(--accent);color:#06100b;border-color:var(--accent);font-weight:700}
main{max-width:1250px;margin:28px auto;padding:0 22px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{background:linear-gradient(145deg,#10202e,#0b151f);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:0 15px 40px #0003}.muted{color:var(--muted);font-size:13px}.value{font-size:28px;font-weight:800;margin-top:7px}.section{margin-top:24px}.section h2{font-size:18px}.toolbar{display:flex;gap:10px;align-items:center;justify-content:space-between;margin-bottom:12px}.table{overflow:auto}.row{display:grid;grid-template-columns:2fr 1fr 1fr 1fr 1fr;gap:10px;padding:13px 10px;border-bottom:1px solid var(--line);min-width:720px}.head{color:var(--muted);font-size:12px;text-transform:uppercase}.login{max-width:390px;margin:14vh auto}.field{display:grid;gap:6px;margin:12px 0}.field input,.field select{background:#08121b;border:1px solid var(--line);color:#fff;border-radius:10px;padding:12px}.pill{display:inline-block;border-radius:999px;padding:5px 9px;background:#153428;color:var(--accent);font-size:12px}.danger{color:#ff8e9b}.hidden{display:none}@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}header{padding:0 14px}nav button{padding:8px}.row{grid-template-columns:2fr 1fr 1fr 1fr 1fr}}
</style></head>
<body>
<header><div class="brand">CRUZE <b>WI-FI</b> BILLING</div><nav><button onclick="show('dashboard')">Dashboard</button><button onclick="show('packages')">Packages</button><button onclick="show('customers')">Customers</button><button onclick="show('payments')">Payments</button><button onclick="show('settings')">Settings</button><button onclick="logout()">Logout</button></nav></header>
<main>
<section id="login" class="login card">
<h1>Admin sign in</h1><div class="field"><label>Email</label><input id="email" value=""></div><div class="field"><label>Password</label><input id="password" type="password"></div><button class="primary" onclick="login()">Sign in</button><p id="loginMsg" class="danger"></p>
</section>
<section id="dashboard" class="hidden">
<h1>Network Overview</h1><div class="grid" id="stats"></div>
<div class="section card"><div class="toolbar"><h2>Router connectivity</h2><button onclick="routerStatus()">Test MikroTik</button></div><div id="router">Not checked</div></div>
</section>
<section id="packages" class="hidden"><div class="toolbar"><h1>Packages & Speed Profiles</h1><button class="primary" onclick="newPackage()">Add package</button></div><div class="card table" id="packageTable"></div></section>
<section id="customers" class="hidden"><div class="toolbar"><h1>Customers & Sessions</h1><button onclick="loadCustomers()">Refresh</button></div><div class="card table" id="customerTable"></div></section>
<section id="payments" class="hidden"><div class="toolbar"><h1>Payments</h1><button onclick="loadPayments()">Refresh</button></div><div class="card table" id="paymentTable"></div></section>
<section id="settings" class="hidden"><h1>System Settings</h1><div class="card"><p class="muted">Operational controls are stored in the database. Keep RouterOS and M-Pesa secrets in the server environment, never in browser storage.</p><div class="field"><label>Portal public URL</label><input id="portalUrl"></div><div class="field"><label>Currency</label><input id="currency" value="KES"></div><button class="primary" onclick="saveSettings()">Save settings</button></div></section>
</main>
<script>
let token=localStorage.getItem("cruze_token");
const $=id=>document.getElementById(id);
function api(path,opt={}){opt.headers={...(opt.headers||{}),...(token?{Authorization:"Bearer "+token}:{})};return fetch(path,opt).then(async r=>{let d=await r.json();if(!r.ok)throw new Error(d.error||"Request failed");return d})}
function show(id){["login","dashboard","packages","customers","payments","settings"].forEach(x=>$(x).classList.toggle("hidden",x!==id)); if(id==="dashboard")loadOverview();if(id==="packages")loadPackages();if(id==="customers")loadCustomers();if(id==="payments")loadPayments();if(id==="settings")loadSettings()}
async function login(){try{let d=await api("/api/auth/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email:$("email").value,password:$("password").value})});token=d.token;localStorage.setItem("cruze_token",token);show("dashboard")}catch(e){$("loginMsg").textContent=e.message}}
function logout(){localStorage.removeItem("cruze_token");token=null;show("login")}
async function loadOverview(){let d=await api("/api/admin/overview");$("stats").innerHTML=[["Customers",d.customers],["Active Sessions",d.active],["Active Packages",d.packages],["Successful Payments",d.payments],["Revenue","Ksh "+d.revenue]].map(x=>`<div class="card"><div class="muted">${x[0]}</div><div class="value">${x[1]}</div></div>`).join("")}
async function routerStatus(){let d=await api("/api/mikrotik/status");$("router").innerHTML=d.connected?`<span class="pill">CONNECTED</span> ${d.host}:${d.port}`:`<span class="danger">OFFLINE</span> ${d.error||""}`}
async function loadPackages(){let d=await api("/api/admin/packages");$("packageTable").innerHTML=`<div class="row head"><div>Package</div><div>Price</div><div>Duration</div><div>Speed</div><div>Status</div></div>`+d.map(p=>`<div class="row"><div><b>${p.name}</b><br><span class="muted">${p.description||""}</span></div><div>Ksh ${p.price}</div><div>${p.durationMinutes} min</div><div>${p.downloadMbps||"—"} ↓ / ${p.uploadMbps||"—"} ↑</div><div>${p.active?'<span class="pill">ACTIVE</span>':'INACTIVE'}</div></div>`).join("")}
async function newPackage(){let name=prompt("Package name");if(!name)return;let price=Number(prompt("Price in Ksh","20"));let mins=Number(prompt("Duration in minutes","1440"));let down=Number(prompt("Download Mbps","5"));let up=Number(prompt("Upload Mbps","2"));await api("/api/admin/packages",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name,price,type:"TIME_DATA",durationMinutes:mins,downloadMbps:down,uploadMbps:up,maxDevices:1,multiplePurchase:true})});loadPackages()}
async function loadCustomers(){let d=await api("/api/admin/customers");$("customerTable").innerHTML=`<div class="row head"><div>Customer</div><div>Status</div><div>Sessions</div><div>MAC</div><div>Created</div></div>`+d.map(c=>`<div class="row"><div><b>${c.phone}</b><br>${c.name||""}</div><div>${c.status}</div><div>${c.sessions.filter(s=>s.status==="ACTIVE").length} active</div><div>${c.macAddress||"—"}</div><div>${new Date(c.createdAt).toLocaleString()}</div></div>`).join("")}
async function loadPayments(){let d=await api("/api/admin/payments");$("paymentTable").innerHTML=`<div class="row head"><div>Customer</div><div>Package</div><div>Amount</div><div>Status</div><div>Time</div></div>`+d.map(p=>`<div class="row"><div>${p.phone}</div><div>${p.package.name}</div><div>Ksh ${p.amount}</div><div>${p.status}</div><div>${new Date(p.createdAt).toLocaleString()}</div></div>`).join("")}
async function loadSettings(){let d=await api("/api/settings");$("portalUrl").value=d.portalUrl||"";$("currency").value=d.currency||"KES"}
async function saveSettings(){await api("/api/settings",{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify({portalUrl:$("portalUrl").value,currency:$("currency").value})});alert("Settings saved")}
show(token?"dashboard":"login");
</script></body></html>
